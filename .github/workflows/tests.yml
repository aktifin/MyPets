name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows-tests:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -q --upgrade pip && python -m pip install -q -e ".[dev]"
      - name: Test
        shell: pwsh
        run: |
          $failed = $false
          python -m pytest -q --tb=short --ignore=tests/test_window.py 2>&1 | Tee-Object -FilePath pytest-output.txt
          if ($LASTEXITCODE -ne 0) { $failed = $true }

          $windowTests = @(
            python -c "import ast, pathlib; p=pathlib.Path('tests/test_window.py'); tree=ast.parse(p.read_text(encoding='utf-8')); print('\n'.join(f'{p.as_posix()}::{node.name}' for node in tree.body if isinstance(node, ast.FunctionDef) and node.name.startswith('test_')))" |
              ForEach-Object { $_.Trim() } |
              Where-Object { $_ }
          )
          if ($windowTests.Count -eq 0) {
            Write-Output "No test_window.py nodes were discovered." | Tee-Object -FilePath pytest-output.txt -Append
            $failed = $true
          }
          foreach ($node in $windowTests) {
            Write-Output "Running isolated Qt test: $node" | Tee-Object -FilePath pytest-output.txt -Append
            python -m pytest -q --tb=short $node 2>&1 | Tee-Object -FilePath pytest-output.txt -Append
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }
          if ($failed) { exit 1 }
      - name: Upload Windows pytest diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-pytest-output-${{ github.run_id }}
          path: pytest-output.txt
          if-no-files-found: error
          retention-days: 7
      - name: Qt smoke test
        run: python main.py --smoke-test-ms 1500
