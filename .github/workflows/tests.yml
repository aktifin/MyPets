name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows-tests:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -q --upgrade pip && python -m pip install -q -e ".[dev]"
      - name: Test
        shell: pwsh
        run: |
          $failed = $false
          python -m pytest -q --tb=short -k "not test_selfie_completion_shows_photo_bubble" 2>&1 | Tee-Object -FilePath pytest-output.txt
          if ($LASTEXITCODE -ne 0) { $failed = $true }
          python -m pytest -q --tb=short tests/test_window.py::test_selfie_completion_shows_photo_bubble 2>&1 | Tee-Object -FilePath pytest-output.txt -Append
          if ($LASTEXITCODE -ne 0) { $failed = $true }
          if ($failed) { exit 1 }
      - name: Upload Windows pytest diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-pytest-output-${{ github.run_id }}
          path: pytest-output.txt
          if-no-files-found: error
          retention-days: 7
      - name: Qt smoke test
        run: python main.py --smoke-test-ms 1500
