name: Apply administrator publishing implementation

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/admin-pet-publishing
          fetch-depth: 0

      - name: Restore implementation files
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .github/admin-publishing-bundle.part00 \
            .github/admin-publishing-bundle.part01 \
            .github/admin-publishing-bundle.part02 \
            .github/admin-publishing-bundle.part03a \
            .github/admin-publishing-bundle.part03b \
            .github/admin-publishing-bundle.part03c30 \
            .github/admin-publishing-bundle.part03c31 \
            .github/admin-publishing-bundle.part03c32 \
            .github/admin-publishing-bundle.part03c33 \
            .github/admin-publishing-bundle.part03c34 \
            .github/admin-publishing-bundle.part04 \
            .github/admin-publishing-bundle.part05a \
            .github/admin-publishing-bundle.part05b0 \
            .github/admin-publishing-bundle.part05b1 \
            .github/admin-publishing-bundle.part05b2 \
            .github/admin-publishing-bundle.part05b3 \
            > /tmp/admin-publishing.b64
          base64 --decode /tmp/admin-publishing.b64 > /tmp/admin-publishing.tar.gz
          gzip -t /tmp/admin-publishing.tar.gz
          tar -xzf /tmp/admin-publishing.tar.gz -C .

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/admin-publishing-bundle.part*
          rm -f .github/workflows/export-admin-branch.yml
          rm -f .github/workflows/apply-admin-publishing.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add administrator pet publishing and automatic asset delivery"
          git push origin HEAD:codex/admin-pet-publishing
