name: Apply administrator publishing implementation

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/admin-pet-publishing
          fetch-depth: 0

      - name: Restore implementation files
        shell: bash
        run: |
          set +e
          {
            set -x
            wc -c .github/admin-publishing-bundle.part*
            cat .github/admin-publishing-bundle.part* > /tmp/admin-publishing.b64
            base64 --decode /tmp/admin-publishing.b64 > /tmp/admin-publishing.tar.gz
            sha256sum /tmp/admin-publishing.tar.gz
            gzip -t /tmp/admin-publishing.tar.gz
            tar -tzf /tmp/admin-publishing.tar.gz
            tar -xzf /tmp/admin-publishing.tar.gz -C .
          } > restore-admin-publishing.log 2>&1
          status=$?
          cat restore-admin-publishing.log
          exit $status

      - name: Upload restore diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-publishing-restore-log
          path: restore-admin-publishing.log
          retention-days: 1

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/admin-publishing-bundle.part*
          rm -f .github/workflows/export-admin-branch.yml
          rm -f .github/workflows/apply-admin-publishing.yml
          rm -f restore-admin-publishing.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add administrator pet publishing and automatic asset delivery"
          git push origin HEAD:codex/admin-pet-publishing
