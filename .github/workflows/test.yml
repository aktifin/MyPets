name: Linux cache, desktop cloud, pet assets, and backend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  local-state:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen
      ONEPIC_USE_DEMO_ASSETS: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and test dependencies
        run: python -m pip install -q --upgrade pip && python -m pip install -q -e ".[dev]"

      - name: Run cache and cloud contract tests
        run: >-
          python -m pytest -q --tb=short
          tests/test_local_store.py
          tests/test_local_store_timezones.py
          tests/test_sync_apply.py
          tests/test_cloud_types.py
          tests/test_cloud_session.py

      - name: Validate Manifest path safety
        run: >-
          python -m pytest -q --tb=short
          tests/test_pet_assets.py::test_manifest_rejects_parent_directory_escape

      - name: Validate versioned asset cache installation
        run: >-
          python -m pytest -q --tb=short
          tests/test_pet_assets.py::test_catalog_installs_and_prefers_exact_cached_package

      - name: Compile desktop package
        run: python -m compileall -q src

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend and test dependencies
        run: python -m pip install -q --upgrade pip && python -m pip install -q -e ".[dev]"

      - name: Run backend tests
        run: python -m pytest -q --tb=short

      - name: Compile backend package
        run: python -m compileall -q src
