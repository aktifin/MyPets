name: Linux local state

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  local-state:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and test dependencies
        run: python -m pip install -q --upgrade pip && python -m pip install -q -e ".[dev]"

      - name: Run platform-neutral local state tests
        run: >-
          python -m pytest -q --tb=short
          tests/test_local_store.py
          tests/test_local_store_timezones.py
