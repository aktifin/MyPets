name: Linux cache, desktop cloud, pet assets, and backend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  local-state:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen
      ONEPIC_USE_DEMO_ASSETS: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Linux Qt runtime libraries
        run: sudo apt-get update -q && sudo apt-get install -y -q libegl1

      - name: Install project and test dependencies
        run: python -m pip install -q --upgrade pip && python -m pip install -q -e ".[dev]"

      - name: Run cache, cloud, messaging, visits, reminder, and pet asset tests
        run: >-
          python -m pytest -q --tb=short
          tests/test_local_store.py
          tests/test_local_store_timezones.py
          tests/test_sync_apply.py
          tests/test_cloud_types.py
          tests/test_cloud_session.py
          tests/test_realtime.py
          tests/test_messaging.py
          tests/test_reminders.py
          tests/test_reminder_resume.py
          tests/test_reminder_management.py
          tests/test_social_shared_care.py
          tests/test_async_visits.py
          tests/test_visit_scene_client.py
          tests/test_guest_pet_window.py
          tests/test_pet_assets.py
          tests/test_asset_download.py

      - name: Compile desktop package
        run: python -m compileall -q src

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend and test dependencies
        run: python -m pip install -q --upgrade pip && python -m pip install -q -e ".[dev]"

      - name: Run backend tests
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q --tb=short 2>&1 | tee pytest-output.txt

      - name: Upload backend pytest diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-pytest-output-${{ github.run_id }}
          path: backend/pytest-output.txt
          if-no-files-found: error
          retention-days: 7

      - name: Validate Web console JavaScript
        run: >-
          node --check src/mypets_backend/admin_console_static/app.js
          && node --check src/mypets_backend/admin_console_static/asset-submissions.js
          && node --check src/mypets_backend/admin_console_static/asset-production.js
          && node --check src/mypets_backend/user_portal_static/app.js
          && node --check src/mypets_backend/user_portal_static/asset-submissions.js
          && node --check src/mypets_backend/user_portal_static/asset-production.js
          && node --check src/mypets_backend/user_portal_static/visits.js
          && node --check src/mypets_backend/user_portal_static/realtime.js

      - name: Compile backend package
        run: python -m compileall -q src
