name: Database migrations

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/database-migrations.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-baseline:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend
        run: python -m pip install -e "backend[dev]" >/dev/null

      - name: Generate deterministic initial revision
        env:
          MYPETS_DATABASE_URL: sqlite:////tmp/mypets-alembic-empty.sqlite3
        run: |
          mapfile -t existing < <(find backend/alembic/versions -maxdepth 1 -type f -name '*.py' ! -name '__init__.py' -print 2>/dev/null || true)
          if [ "${#existing[@]}" -gt 0 ]; then
            echo "A committed Alembic revision already exists:"
            printf '%s\n' "${existing[@]}"
            exit 0
          fi
          mkdir -p backend/alembic/versions
          cd backend
          alembic revision --autogenerate --rev-id 20260726_0001 -m "initial schema" >/tmp/alembic-generate.log
          python -m compileall -q alembic
          grep -q "op.create_table" alembic/versions/*.py

      - name: Persist generated baseline
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          mapfile -t files < <(find backend/alembic/versions -maxdepth 1 -type f -name '*.py' ! -name '__init__.py' -print)
          if [ "${#files[@]}" -ne 1 ]; then
            echo "Expected exactly one migration, found ${#files[@]}."
            printf '%s\n' "${files[@]}"
            exit 1
          fi
          file="${files[0]}"
          if git ls-files --error-unmatch "$file" >/dev/null 2>&1; then
            echo "$file is already committed."
            exit 0
          fi
          echo "Committing $file"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "$file"
          git diff --cached --stat
          git commit -m "Add generated Alembic initial schema"
          git push origin "HEAD:$HEAD_BRANCH"
