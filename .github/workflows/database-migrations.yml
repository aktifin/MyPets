name: Database migrations

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/database-migrations.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-baseline:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend
        run: python -m pip install -e "backend[dev]" >/dev/null

      - name: Regenerate deterministic initial revision
        env:
          MYPETS_DATABASE_URL: sqlite:////tmp/mypets-alembic-empty.sqlite3
        run: |
          rm -rf backend/alembic/versions
          mkdir -p backend/alembic/versions
          cd backend
          alembic revision --autogenerate --rev-id 20260726_0001 -m "initial schema" >/tmp/alembic-generate.log
          python -m compileall -q alembic
          grep -q "op.create_table" alembic/versions/*.py

      - name: Commit generated baseline
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          mapfile -t files < <(find backend/alembic/versions -maxdepth 1 -type f -name '*.py' -print)
          if [ "${#files[@]}" -ne 1 ]; then
            echo "Expected exactly one generated migration, found ${#files[@]}."
            printf '%s\n' "${files[@]}"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -f backend/alembic/versions
          if git diff --cached --quiet; then
            echo "Generated revision already matches the committed baseline."
            exit 0
          fi
          git diff --cached --stat
          git commit -m "Add generated Alembic initial schema"
          git push origin "HEAD:$HEAD_BRANCH"
