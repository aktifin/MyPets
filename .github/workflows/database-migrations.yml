name: Database migrations

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/database-migrations.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-baseline:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend
        run: python -m pip install -e "backend[dev]"

      - name: Generate deterministic initial revision
        env:
          MYPETS_DATABASE_URL: sqlite:////tmp/mypets-alembic-empty.sqlite3
        run: |
          if compgen -G "backend/alembic/versions/*.py" > /dev/null; then
            echo "A committed Alembic revision already exists."
            exit 0
          fi
          mkdir -p backend/alembic/versions
          cd backend
          alembic revision --autogenerate --rev-id 20260726_0001 -m "initial schema"
          python -m compileall alembic
          grep -R "op.create_table" alembic/versions/*.py

      - name: Commit generated baseline
        run: |
          if [ -z "$(git status --porcelain -- backend/alembic/versions)" ]; then
            echo "No generated migration changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/alembic/versions
          git commit -m "Add generated Alembic initial schema"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
