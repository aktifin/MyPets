name: Database migrations

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/database-migrations.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend
        run: python -m pip install -e "backend[dev]"

      - name: Generate deterministic initial revision
        env:
          MYPETS_DATABASE_URL: sqlite:////tmp/mypets-alembic-empty.sqlite3
        run: |
          mkdir -p backend/alembic/versions
          rm -f backend/alembic/versions/*.py
          cd backend
          alembic revision --autogenerate --rev-id 20260726_0001 -m "initial schema"
          python -m compileall alembic
          grep -R "op.create_table" alembic/versions/*.py

      - name: Upload generated baseline
        uses: actions/upload-artifact@v4
        with:
          name: alembic-generated-baseline
          path: backend/alembic/versions/*.py
          if-no-files-found: error
          retention-days: 1
