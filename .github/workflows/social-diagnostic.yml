name: Social backend diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  social-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend
        run: python -m pip install -q -e '.[dev]'
      - name: Run social tests verbosely
        run: python -m pytest tests/test_social_shared_care.py -x -vv --tb=long
