name: Social backend diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  social-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend
        run: python -m pip install -q -e '.[dev]'
      - name: Run social tests and print failure tail
        shell: bash
        run: |
          set +e
          python -m pytest tests/test_social_shared_care.py -x -vv --tb=long > /tmp/social-pytest.log 2>&1
          status=$?
          tail -n 180 /tmp/social-pytest.log
          exit $status
