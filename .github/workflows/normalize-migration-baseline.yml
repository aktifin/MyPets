name: Normalize migration baseline

on:
  pull_request:
    paths:
      - "backend/alembic/**"
      - ".github/workflows/normalize-migration-baseline.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Preserve the deployed revision identity
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil

          source = Path("backend/alembic/versions/20260726_0001_initial_schema.py")
          target = Path("backend/alembic/versions/001_initial_schema.py")
          if source.exists():
              text = source.read_text(encoding="utf-8")
              text = text.replace("Revision ID: 20260726_0001", "Revision ID: 001_initial_schema")
              text = text.replace("revision: str = '20260726_0001'", "revision: str = '001_initial_schema'")
              text = text.replace('revision: str = "20260726_0001"', 'revision: str = "001_initial_schema"')
              target.write_text(text, encoding="utf-8")
              source.unlink()
          shutil.rmtree("backend/alembic/versions/__pycache__", ignore_errors=True)
          PY

      - name: Commit normalization
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A backend/alembic/versions
          if git diff --cached --quiet; then
            echo "Migration baseline is already normalized."
            exit 0
          fi
          git commit -m "Preserve Alembic initial revision compatibility"
          git push origin "HEAD:$HEAD_BRANCH"
