name: messaging diagnostics

on:
  pull_request:

permissions:
  contents: read

jobs:
  targeted-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -q --upgrade pip && python -m pip install -q -e ".[dev]"
      - name: Targeted tests
        shell: pwsh
        run: |
          python -m pytest -vv -x tests/test_messaging.py tests/test_cloud_session.py 2>&1 | Tee-Object -FilePath messaging-test.log
          exit $LASTEXITCODE
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: messaging-test-log
          path: messaging-test.log
