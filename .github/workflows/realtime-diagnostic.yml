name: Realtime Qt diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  realtime-qt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen
      ONEPIC_USE_DEMO_ASSETS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: sudo apt-get update -q && sudo apt-get install -y -q libegl1
      - run: python -m pip install -q --upgrade pip && python -m pip install -q -e ".[dev]"
      - name: Run realtime Qt test
        run: python -m pytest tests/test_realtime.py -vv --tb=long
