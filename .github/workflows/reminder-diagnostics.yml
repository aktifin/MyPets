name: reminder diagnostics

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-reminders:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: python -m pip install -q --upgrade pip && python -m pip install -q -e ".[dev]"
      - name: Reminder tests
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -vv -x tests/test_reminders.py 2>&1 | tee reminder-test.log
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reminder-backend-test-log
          path: backend/reminder-test.log
