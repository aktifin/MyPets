name: Debug pet care tests

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-diagnostic:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend
        run: python -m pip install -e "./backend[dev]"
      - name: Capture backend test output
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          set +e
          cd backend
          python -m pytest -q > ../backend-test.log 2>&1
          code=$?
          echo "$code" > ../backend-test.exit
          exit "$code"
      - name: Upload backend test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-pet-care-test-log
          path: |
            backend-test.log
            backend-test.exit
          if-no-files-found: error
      - name: Preserve test result
        if: steps.tests.outcome == 'failure'
        run: exit 1
