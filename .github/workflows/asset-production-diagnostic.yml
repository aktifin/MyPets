name: Asset production diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -q --upgrade pip && python -m pip install -q -e ".[dev]"
      - name: Run focused asset production tests
        id: tests
        shell: bash
        run: |
          set +e
          python -m pytest -vv --tb=long tests/test_asset_production.py tests/test_asset_production_web.py > pytest.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload focused pytest log
        uses: actions/upload-artifact@v4
        with:
          name: asset-production-pytest-log
          path: backend/pytest.log
          if-no-files-found: error
      - name: Fail when focused tests failed
        if: steps.tests.outputs.exit_code != '0'
        run: exit 1
