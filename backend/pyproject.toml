[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "mypets-backend"
version = "0.3.0a1"
description = "MyPets 服务端，提供账户、宠物、社交、消息提醒、同步、用户门户和内容运营能力。"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.128,<1",
    "uvicorn>=0.40,<1",
    "websockets>=12,<14",
    "SQLAlchemy>=2.0,<2.2",
    "alembic>=1.14,<2",
    "pydantic>=2.12,<3",
    "PyJWT>=2.10,<3",
    "argon2-cffi>=25,<26",
    "python-multipart>=0.0.20,<1",
    "Pillow>=10,<13",
    "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8,<10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mypets_backend = [
    "admin_console_static/*.html",
    "admin_console_static/*.js",
    "admin_console_static/*.css",
    "user_portal_static/*.html",
    "user_portal_static/*.js",
    "user_portal_static/*.css",
]
