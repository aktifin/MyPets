<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MyPets 宠物内容管理台</title>
  <link rel="stylesheet" href="/admin/styles.css">
</head>
<body>
  <div id="loginView" class="login-shell">
    <form id="loginForm" class="login-card">
      <div class="brand-mark">MP</div>
      <p class="eyebrow">MYPETS CONTENT OPERATIONS</p>
      <h1>宠物内容管理台</h1>
      <p class="muted">使用服务端配置的管理员账户登录。访问令牌只保存在当前浏览器会话。</p>
      <label>用户名<input id="username" name="username" autocomplete="username" required></label>
      <label>密码<input id="password" name="password" type="password" autocomplete="current-password" minlength="12" required></label>
      <button class="primary" type="submit">登录管理台</button>
      <p id="loginError" class="error" role="alert"></p>
    </form>
  </div>

  <div id="appView" class="app-shell hidden">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark small">MP</span><div><strong>MyPets</strong><small>内容管理</small></div></div>
      <nav id="navigation">
        <button data-view="dashboard" class="active">总览</button>
        <button data-view="templates">宠物模板</button>
        <button data-view="reviews" data-requires="review">审核中心</button>
        <button data-view="releases">发布与回滚</button>
        <button data-view="audit" data-requires="audit">审计日志</button>
      </nav>
      <div class="sidebar-footer">
        <span id="accountName"></span>
        <div id="roleBadges" class="role-badges"></div>
        <button id="logoutButton" class="ghost">退出登录</button>
      </div>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <div><p class="eyebrow">ADMIN CONSOLE</p><h2 id="viewTitle">总览</h2></div>
        <div id="globalStatus" class="status-line" aria-live="polite"></div>
      </header>

      <section id="dashboardView" class="view-panel">
        <div id="summaryCards" class="summary-grid"></div>
        <div class="panel-grid">
          <article class="panel"><div class="panel-heading"><h3>待审核版本</h3><button data-jump="reviews" data-requires="review" class="link-button">进入审核中心</button></div><div id="dashboardReviews"></div></article>
          <article class="panel"><div class="panel-heading"><h3>当前稳定发布</h3><button data-jump="releases" class="link-button">查看全部</button></div><div id="dashboardReleases"></div></article>
        </div>
      </section>

      <section id="templatesView" class="view-panel hidden">
        <div class="split-layout">
          <aside class="panel list-panel">
            <div class="panel-heading"><h3>模板</h3><button id="newTemplateButton" data-requires="edit" class="primary compact">新建</button></div>
            <input id="templateSearch" class="search" placeholder="搜索名称、编码或物种">
            <div id="templateList" class="item-list"></div>
          </aside>
          <div class="workspace">
            <article id="templateEmpty" class="empty-state">选择一个模板查看版本，或创建新的标准宠物模板。</article>
            <div id="templateWorkspace" class="hidden">
              <article class="panel hero-panel"><div><p id="templateCode" class="eyebrow"></p><h3 id="templateName"></h3><p id="templateDescription" class="muted"></p></div><span id="templateStatus" class="badge"></span></article>
              <article class="panel">
                <div class="panel-heading"><h3>模板版本</h3><button id="newVersionButton" data-requires="edit" class="primary compact">创建版本</button></div>
                <div id="versionList" class="version-grid"></div>
              </article>
              <article id="versionDetail" class="panel hidden">
                <div class="panel-heading"><div><p id="versionIdentity" class="eyebrow"></p><h3 id="versionTitle"></h3></div><span id="versionStatus" class="badge"></span></div>
                <div class="detail-grid"><div><span>包大小</span><strong id="packageSize">—</strong></div><div><span>SHA-256</span><code id="packageHash">—</code></div><div><span>审核意见</span><strong id="reviewComment">—</strong></div></div>
                <div id="versionActions" class="button-row"></div>
                <div id="uploadArea" class="upload-area" data-requires="edit">
                  <input id="packageFile" type="file" accept=".zip,application/zip">
                  <button id="uploadButton" class="secondary">上传并校验 ZIP</button>
                  <div class="progress-track"><span id="uploadProgress"></span></div>
                </div>

                <div id="previewArea" class="visual-acceptance hidden">
                  <div class="acceptance-heading"><div><p class="eyebrow">VISUAL ACCEPTANCE</p><h4>连续动画与桌面适配预览</h4></div><div class="compare-controls"><select id="compareVersion"><option value="">选择对比版本</option></select><button id="compareButton" class="secondary compact">对比</button></div></div>
                  <div class="preview-layout">
                    <div>
                      <div id="deviceSimulator" class="device-simulator preset-desktop">
                        <div class="desktop-canvas"><img id="previewImage" alt="宠物素材预览"></div>
                      </div>
                      <div class="preview-controls advanced">
                        <select id="previewAction"></select>
                        <button id="previousFrame" class="secondary compact" aria-label="上一帧">◀</button>
                        <input id="previewFrame" type="number" min="0" value="0">
                        <button id="nextFrame" class="secondary compact" aria-label="下一帧">▶</button>
                        <button id="playPreview" class="primary compact">播放</button>
                        <select id="previewFps" aria-label="预览帧率"><option value="4">4 FPS</option><option value="8" selected>8 FPS</option><option value="12">12 FPS</option><option value="24">24 FPS</option></select>
                        <select id="devicePreset" aria-label="设备预设"><option value="desktop">桌面 16:9</option><option value="compact">紧凑 4:3</option><option value="portrait">竖屏 9:16</option></select>
                      </div>
                    </div>
                    <div><h4>动作能力矩阵</h4><div id="actionMatrix" class="matrix"></div></div>
                  </div>
                  <div id="comparisonResult" class="comparison-result hidden"></div>
                </div>
              </article>
            </div>
          </div>
        </div>
      </section>

      <section id="reviewsView" class="view-panel hidden"><article class="panel"><div class="panel-heading"><h3>待审核版本</h3><button id="refreshReviews" class="secondary compact">刷新</button></div><div id="reviewList" class="review-list"></div></article></section>
      <section id="releasesView" class="view-panel hidden">
        <article class="panel"><div class="panel-heading"><h3>当前稳定通道</h3><button id="refreshReleases" class="secondary compact">刷新</button></div><div id="deploymentList" class="deployment-grid"></div></article>
        <article class="panel release-panel"><div class="panel-heading"><h3>不可变发布记录</h3><span class="muted">回滚只切换稳定指针，不删除发布包</span></div><div id="releaseList" class="table-wrap"></div></article>
      </section>
      <section id="auditView" class="view-panel hidden"><article class="panel"><div class="panel-heading"><h3>管理员操作审计</h3><button id="refreshAudit" class="secondary compact">刷新</button></div><div id="auditList" class="table-wrap"></div></article></section>
    </main>
  </div>

  <dialog id="templateDialog"><form id="templateForm" method="dialog"><h3>创建宠物模板</h3><label>模板编码<input name="template_code" placeholder="official.cat.white" pattern="[A-Za-z0-9_.-]+" required></label><label>显示名称<input name="display_name" required></label><label>物种<input name="species" required></label><label>说明<textarea name="description" rows="4"></textarea></label><div class="dialog-actions"><button value="cancel" class="ghost">取消</button><button value="default" class="primary">创建</button></div></form></dialog>
  <dialog id="versionDialog"><form id="versionForm" method="dialog"><h3>创建模板版本</h3><label>模板版本<input name="template_version" value="1.0.0" required></label><label>视觉身份版本<input name="identity_version" value="1.0.0" required></label><label>素材版本<input name="asset_version" value="1.0.0" required></label><div class="dialog-actions"><button value="cancel" class="ghost">取消</button><button value="default" class="primary">创建</button></div></form></dialog>
  <dialog id="reviewDialog"><form id="reviewForm" method="dialog"><h3 id="reviewDialogTitle">审核版本</h3><input id="reviewVersionId" type="hidden"><input id="reviewDecision" type="hidden"><label>审核意见<textarea id="reviewDecisionComment" rows="5" maxlength="2000"></textarea></label><div class="dialog-actions"><button value="cancel" class="ghost">取消</button><button value="default" class="primary">确认</button></div></form></dialog>
  <dialog id="rollbackDialog"><form id="rollbackForm" method="dialog"><h3>回滚稳定版本</h3><input id="rollbackTemplateId" type="hidden"><input id="rollbackReleaseId" type="hidden"><p id="rollbackTarget" class="muted"></p><label>回滚原因<textarea id="rollbackReason" rows="5" minlength="3" maxlength="1000" required></textarea></label><div class="dialog-actions"><button value="cancel" class="ghost">取消</button><button value="default" class="primary danger">确认回滚</button></div></form></dialog>

  <script src="/admin/app.js" defer></script>
</body>
</html>
