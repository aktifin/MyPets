<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyPets Web 管理控制台</title>
    <link rel="stylesheet" href="/admin/css/admin_cute.css">
</head>
<body>

    <header class="admin-header">
        <div class="admin-title">⚙️ 宠物内容管理台 - MyPets 运营与控制台</div>
        <div>
            <span style="font-size: 13px; color: #8A8A9E;">管理员权限: 审计与发布</span>
        </div>
    </header>

    <div class="admin-container">
        <!-- 统计看板卡片 -->
        <div class="admin-card-grid">
            <div class="stat-card">
                <div style="font-size: 14px; color: #8A8A9E;">👥 注册用户总数</div>
                <div class="stat-value">128</div>
            </div>
            <div class="stat-card">
                <div style="font-size: 14px; color: #8A8A9E;">🐾 活跃桌面宠物</div>
                <div class="stat-value">256</div>
            </div>
            <div class="stat-card">
                <div style="font-size: 14px; color: #8A8A9E;">📋 待审核制作工单</div>
                <div class="stat-value" style="color: #FF9EAA;">3</div>
            </div>
            <div class="stat-card">
                <div style="font-size: 14px; color: #8A8A9E;">📦 私有 Release 数量</div>
                <div class="stat-value" style="color: #3B82F6;">42</div>
            </div>
        </div>

        <!-- 审核工作台 -->
        <div class="stat-card" style="margin-bottom: 24px;">
            <h3 style="margin-top: 0; color: #8A5A83;">🖼️ 专属形象与工单审核工作台</h3>
            <p style="font-size: 13px; color: #8A8A9E;">支持工单状态机 (queued ➔ processing ➔ ready ➔ published) 三权分离核验与一键回退。</p>
        </div>
    </div>

    <script src="/admin/app.js" defer></script>
</body>
</html>
